<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amine ADMANE – Consultant QA Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060B1A; --ink:#EEF1F8; --muted:#97A3BF; --line:#1C2848; --gold:#E2B655; --glow:rgba(226,182,85,.18);
  --serif:"Fraunces",Georgia,serif; --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F4F5F9;--ink:#0E1A36;--muted:#4F5B77;--line:#D6DAE6;--gold:#936A12;--glow:rgba(147,106,18,.12);color-scheme:light}
}
:root[data-theme="light"]{--bg:#F4F5F9;--ink:#0E1A36;--muted:#4F5B77;--line:#D6DAE6;--gold:#936A12;--glow:rgba(147,106,18,.12);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.5rem}

/* HERO plein écran (toujours sombre) */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;color:#EEF1F8;background:#060B1A;overflow:hidden}
.hero canvas,.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero video{display:none}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 100%,rgba(6,11,26,.92),rgba(6,11,26,.25) 60%,rgba(6,11,26,.55));pointer-events:none}
.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:4.5rem}
.bar{position:absolute;z-index:3;top:0;left:0;right:0;padding-top:calc(1.2rem + env(safe-area-inset-top,0px));}
.bar .wrap{display:flex;justify-content:space-between;align-items:center;padding-bottom:0}
.brand{font:700 1.15rem var(--serif);text-decoration:none}
.bar nav{display:flex;gap:1.6rem}
.bar nav a{text-decoration:none;font-weight:500;font-size:.95rem;opacity:.8}
.bar nav a:hover{opacity:1;color:#E2B655}
.role{color:#E2B655;font-weight:600;margin:0 0 1.2rem}
h1{font:900 clamp(2.8rem,9.5vw,8rem)/.95 var(--serif);letter-spacing:-.035em;margin:0 0 1.8rem}
h1 .l{display:block;overflow:hidden;padding-bottom:.08em}
h1 .l span{display:block;transform:translateY(105%);transition:transform .55s cubic-bezier(.6,0,.8,.4)}
.msg.in h1 .l span{transform:none;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.msg.in h1 .l:nth-child(2) span{transition-delay:.15s}
.msg.in h1 .l:nth-child(3) span{transition-delay:.3s}
.msg.out h1 .l span{transform:translateY(-105%)}
.msg.reset *{transition:none!important}
.lead{font-size:clamp(1.05rem,2vw,1.35rem);max-width:38rem;color:#C5CDE0;margin:0 0 2.2rem;min-height:5.6em;opacity:0;transition:opacity .4s}
.msg.in .lead{opacity:1;transition:opacity 1s .6s}
@media (max-width:640px){.lead{min-height:8.4em}}
.tabs{display:flex;gap:1rem;margin-top:2.6rem;flex-wrap:wrap}
.tab{flex:1 1 9rem;max-width:15rem;position:relative;text-align:left;background:none;border:0;color:#97A3BF;font:500 .92rem var(--sans);padding:.8rem 0 0;cursor:pointer}
.tab::before,.tab::after{content:"";position:absolute;left:0;top:0;height:2px}
.tab::before{width:100%;background:rgba(238,241,248,.2)}
.tab::after{width:0;background:#E2B655}
.tab:hover{color:#EEF1F8}
.tab[aria-selected="true"]{color:#EEF1F8}
.tab[aria-selected="true"]::after{animation:fill var(--dur) linear forwards}
@keyframes fill{to{width:100%}}
@keyframes fade{to{opacity:1}}
.cta{display:flex;gap:.9rem;flex-wrap:wrap;opacity:0;animation:fade 1s 1.1s forwards}
.btn{display:inline-block;padding:.95rem 1.7rem;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid currentColor;transition:background .25s,color .25s,border-color .25s}
.btn.primary{background:#E2B655;border-color:#E2B655;color:#0A1228}
.btn:hover{background:#EEF1F8;border-color:#EEF1F8;color:#0A1228}

/* Chiffres */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:2rem;padding:4.5rem 0;border-bottom:1px solid var(--line)}
.stats dt{font:900 clamp(2.8rem,6vw,4.6rem)/1 var(--serif);color:var(--gold);letter-spacing:-.03em}
.stats dd{margin:.5rem 0 0;color:var(--muted);max-width:14rem}

/* Sections */
h2{font:700 clamp(2rem,5vw,3.6rem)/1.05 var(--serif);letter-spacing:-.02em;margin:0 0 3rem}
section{padding:5.5rem 0}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2.5rem 3rem}
.skills h3{font:600 1rem var(--sans);color:var(--gold);margin:0 0 .8rem}
.skills ul{list-style:none;margin:0;padding:0}
.skills li{font:500 1.5rem/1.35 var(--serif);padding:.15rem 0}

/* Expériences : lignes cinématographiques */
.xp{display:grid;grid-template-columns:minmax(7rem,16rem) 1fr;gap:2rem;padding:2.8rem 0;border-top:1px solid var(--line);opacity:0;transform:translateY(2rem);transition:opacity .9s,transform .9s}
.xp.in{opacity:1;transform:none}
.xp .yr{font:900 clamp(2.4rem,5vw,4.2rem)/1 var(--serif);color:transparent;-webkit-text-stroke:1.5px var(--gold);letter-spacing:-.02em}
.xp h3{font:700 clamp(1.5rem,3vw,2.2rem)/1.15 var(--serif);margin:0 0 .2rem}
.xp .org{color:var(--muted);margin:0 0 1rem}
.xp p{margin:0 0 1rem;max-width:42rem}
.xp ul.r{margin:0 0 1.2rem;padding-left:1.1rem;max-width:42rem;color:var(--muted)}
.xp ul.r li{margin:.3rem 0}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;padding:0;margin:0}
.tags li{border:1px solid var(--line);border-radius:999px;font-size:.85rem;padding:.2rem .8rem;color:var(--muted)}

/* Clients : défilement continu */
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;width:max-content;animation:scroll 40s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.set{display:flex;align-items:center;gap:4.5rem;padding-right:4.5rem;list-style:none;margin:0}
.cl{flex:none;display:flex;align-items:center;height:3.5rem}
.cl img{max-height:3rem;max-width:10rem;width:auto;filter:brightness(0) invert(1);opacity:.55;transition:opacity .3s}
.cl:hover img{opacity:1}
.cl .wm{font:700 1.7rem var(--serif);letter-spacing:-.02em;color:var(--muted);white-space:nowrap;transition:color .3s}
.cl:hover .wm{color:var(--ink)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .cl img{filter:brightness(0)}}
:root[data-theme="light"] .cl img{filter:brightness(0)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* Contact */
.contact{text-align:left;border-top:1px solid var(--line);background:radial-gradient(70% 90% at 80% 100%,var(--glow),transparent 70%)}
.big{display:inline-block;font:900 clamp(1.7rem,6.2vw,5rem)/1.05 var(--serif);letter-spacing:-.03em;text-decoration:none;border-bottom:3px solid var(--gold);word-break:break-word;margin-bottom:2rem}
.big:hover{color:var(--gold)}
.contact p{color:var(--muted);max-width:34rem}
.contact .btn{color:var(--ink)}
.contact .btn:hover{color:#0A1228}
footer{padding:2rem 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media (max-width:640px){.bar nav{gap:1rem}.bar nav a:first-child{display:none}.xp{grid-template-columns:1fr;gap:.8rem}.hero .wrap{padding-bottom:3rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.track{animation:none;flex-wrap:wrap;width:auto}.set[aria-hidden]{display:none}h1 .l span{transform:none;transition:none}.lead,.cta{opacity:1;animation:none;transition:none}.tab[aria-selected="true"]::after{animation:none;width:100%}.xp{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<header class="hero" id="accueil">
  <canvas id="fx" aria-hidden="true"></canvas>
  <video id="cover" autoplay muted loop playsinline aria-hidden="true"></video>
  <div class="bar"><div class="wrap">
    <a class="brand" href="#accueil" id="brand"></a>
    <nav aria-label="Navigation principale"><a href="#competences">Expertise</a><a href="#clients">Clients</a><a href="parcours.html">Parcours</a><a href="#contact">Contact</a></nav>
  </div></div>
  <div class="wrap">
    <p class="role" id="role"></p>
    <div class="msg" id="msg"><h1 id="headline"></h1><p class="lead" id="intro"></p></div>
    <div class="cta"><a class="btn primary" href="#competences">Découvrir mon expertise</a><a class="btn" href="#contact">Me contacter</a></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Mes domaines d’expertise"></div>
  </div>
</header>

<main>
  <div class="wrap"><dl class="stats" id="stats"></dl></div>
  <section id="competences"><div class="wrap"><h2>Mon expertise</h2><div class="skills" id="skills"></div></div></section>
  <section id="clients"><div class="wrap"><h2>Ils m’ont fait confiance</h2></div>
    <div class="marquee" aria-label="Clients chez qui je suis intervenue"><div class="track" id="track"></div></div>
  </section>
  <section class="contact" id="contact"><div class="wrap">
    <h2>Votre prochain projet commence ici.</h2>
    <a class="big" id="mail" href="#"></a>
    <p id="contactText"></p>
    <a class="btn" id="linkedin" href="#">Profil LinkedIn</a>
  </div></section>
</main>
<footer><div class="wrap" id="footer"></div></footer>

<script>
/* ====== VOS DONNÉES : seule cette partie est à modifier ====== */
const DATA = {
  nom: "Amine Admane",
  role: "Consultant QA Data & tests technico-fonctionnels · Freelance",
  /* Un message d’accroche par volet d’expertise : ils défilent en couverture. */
  messages: [
    { label: "Qualité des données", titre: ["Des données", "auxquelles", "on peut croire."],
      intro: "Validation source vs cible, non-régression des KPI, observabilité : je sécurise vos migrations et vos dashboards sur BigQuery, Snowflake, Databricks et AWS." },
    { label: "Tests fonctionnels", titre: ["Des logiciels", "qui tiennent", "leurs promesses."],
      intro: "Plans de test, recette, UAT et non-régression : je vérifie chaque parcours critique avant que vos utilisateurs ne le rencontrent." },
    { label: "Automatisation & tests techniques", titre: ["Des livraisons", "sans mauvaise", "surprise."],
      intro: "J’automatise vos tests avec Tricentis Tosca, Soda SQL, Robot Framework et Python : API, non-régression planifiée, rapports automatiques." }
  ],
  /* Vidéo de fond : mettez ici le chemin de votre fichier, par exemple "cover.mp4" (dépôt GitHub).
     Laissé vide, une animation de données s’affiche à la place. */
  video: "",
  chiffres: [
    { valeur: "8 ans", libelle: "d’expérience en data quality et tests" },
    { valeur: "5 clients", libelle: "dont Edenred, L’Oréal, Disneyland Paris et la Fédération Française de Tennis" },
    { valeur: "6 secteurs", libelle: "e-commerce, hôtellerie, luxe, sport, mode, cosmétiques" }
  ],
  /* Clients : "logo" = chemin de l’image dans votre dépôt (ex. "logos/client.svg"). Sans logo, le nom s’affiche en texte. */
  clients: [
    { nom: "Edenred", logo: "" }, { nom: "L’Oréal", logo: "" }, { nom: "Disneyland Paris", logo: "" },
    { nom: "Fédération Française de Tennis", logo: "" }, { nom: "Familles de France", logo: "" }
  ],
  competences: [
    { groupe: "Tests fonctionnels", liste: ["Plans et cas de test", "Recette, UAT et non-régression", "Ergonomie et compatibilité", "Tricentis qTest, SquashTM"] },
    { groupe: "Automatisation & tests techniques", liste: ["Tricentis Tosca", "Tests d’API : Postman, Insomnia, Python", "Robot Framework", "Performance, charge et sécurité"] },
    { groupe: "Data quality & cloud", liste: ["Validation source vs cible", "Observabilité avec Soda SQL", "BigQuery, Snowflake, Databricks, AWS", "Power BI, SQL, Python"] }
  ],
  contact: { texte: "Une mission, un audit ou une simple question : écrivez-moi, je réponds sous 48 heures.", email: "amineadmane@hotmail.fr", linkedin: "" }
};
/* ====== FIN DES DONNÉES ====== */

const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
$("brand").textContent = DATA.nom; $("role").textContent = DATA.role;
document.title = DATA.nom + " – " + DATA.role;
/* Couverture : un message par volet, qui défile */
const msgEl = $("msg"), SLIDES = DATA.messages, DUR = 7000;
let timer;
const still = matchMedia("(prefers-reduced-motion:reduce)").matches;
const tabs = SLIDES.map((s, i) => { const b = el("button", "tab", s.label); b.type = "button"; b.setAttribute("role", "tab"); b.style.setProperty("--dur", DUR + "ms"); b.onclick = () => { if (b.getAttribute("aria-selected") !== "true") go(i); }; $("tabs").append(b); return b; });
function show(i) {
  $("headline").replaceChildren();
  SLIDES[i].titre.forEach(t => { const l = el("span", "l"); l.append(el("span", null, t)); $("headline").append(l); });
  $("intro").textContent = SLIDES[i].intro;
  tabs.forEach((b, k) => b.setAttribute("aria-selected", String(k === i)));
  msgEl.className = "msg reset"; void msgEl.offsetWidth; msgEl.className = "msg in";
  if (!still) timer = setTimeout(() => go((i + 1) % SLIDES.length), DUR);
}
function go(i) { clearTimeout(timer); msgEl.className = "msg out"; timer = setTimeout(() => show(i), 550); }
show(0);
DATA.chiffres.forEach(c => { const d = el("div"); d.append(el("dt", null, c.valeur), el("dd", null, c.libelle)); $("stats").append(d); });
DATA.competences.forEach(g => { const b = el("div"); b.append(el("h3", null, g.groupe)); const u = el("ul"); g.liste.forEach(s => u.append(el("li", null, s))); b.append(u); $("skills").append(b); });
const logos = [...DATA.clients, ...DATA.clients].map(c => { const li = el("li", "cl"); if (c.logo) { const i = el("img"); i.src = c.logo; i.alt = c.nom; i.loading = "lazy"; li.append(i); } else li.append(el("span", "wm", c.nom)); return li; });
[0, 1].forEach(k => { const ul = el("ul", "set"); if (k) ul.setAttribute("aria-hidden", "true"); logos.forEach(li => ul.append(k ? li.cloneNode(true) : li)); $("track").append(ul); });
$("mail").textContent = DATA.contact.email; $("mail").href = "mailto:" + DATA.contact.email;
$("contactText").textContent = DATA.contact.texte;
if (DATA.contact.linkedin) $("linkedin").href = DATA.contact.linkedin; else $("linkedin").style.display = "none";
$("footer").textContent = "© " + new Date().getFullYear() + " " + DATA.nom;

/* Apparition des expériences au défilement */
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 }) : null;
document.querySelectorAll(".xp").forEach(n => io ? io.observe(n) : n.classList.add("in"));

/* Couverture : vidéo si fournie, sinon animation de données */
const cv = $("cover"), cx = $("fx");
if (DATA.video) { cv.src = DATA.video; cv.style.display = "block"; cx.style.display = "none"; }
else {
  const g = cx.getContext("2d"), still = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let W, H, P = [], m = { x: -999, y: -999 };
  const size = () => { const d = Math.min(devicePixelRatio || 1, 2); W = cx.clientWidth; H = cx.clientHeight; cx.width = W * d; cx.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.round(Math.min(110, W * H / 14000)); P = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35, r: Math.random() * 1.8 + .6 })); };
  const draw = () => {
    g.clearRect(0, 0, W, H);
    for (const p of P) {
      if (!still) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
        const dx = m.x - p.x, dy = m.y - p.y, d = Math.hypot(dx, dy); if (d < 160) { p.x -= dx / d * .6; p.y -= dy / d * .6; } }
    }
    for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
      const d = Math.hypot(P[i].x - P[j].x, P[i].y - P[j].y);
      if (d < 130) { g.strokeStyle = "rgba(226,182,85," + (.28 * (1 - d / 130)) + ")"; g.lineWidth = .8; g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke(); }
    }
    for (const p of P) { g.fillStyle = "rgba(238,241,248,.85)"; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill(); }
    if (!still) requestAnimationFrame(draw);
  };
  addEventListener("resize", () => { size(); if (still) draw(); });
  cx.parentElement.addEventListener("pointermove", e => { const b = cx.getBoundingClientRect(); m.x = e.clientX - b.left; m.y = e.clientY - b.top; });
  cx.parentElement.addEventListener("pointerleave", () => { m.x = m.y = -999; });
  size(); draw();
}
</script>
</body>
</html>
